[build]
  base = "."
  command = "npm install && cd client && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions mit esbuild bundlen (TypeScript Support)
[functions]
  node_bundler = "esbuild"
  included_files = ["server/src/**"]

# API-Requests an die Netlify Function weiterleiten
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA Fallback – alle anderen Routen an index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# === Performance-Headers ===
# Hashed Assets (Vite) sind unveraenderlich → 1 Jahr cachen
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts ebenfalls aggressiv cachen
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Bilder lange cachen (User-Logo etc.)
[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# index.html niemals cachen (sonst sieht User alte Bundle-Hashes)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"


# Automatisches Nachfassen: taeglich Mo-Fr um 07:15 UTC.
# Deklarativ hier, damit der Zeitplan auch bei manuellen Deploys greift.
[functions."followup"]
  schedule = "15 7 * * 1-5"

[functions."kampagnen"]
  schedule = "5 6-16 * * 1-5"
